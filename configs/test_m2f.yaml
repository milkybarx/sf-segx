data:
  annotations_file: train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  dataset_root: images/MAGFiLO_1.0_Kaggle_2026
  image_size: 512
  num_workers: 0
  original_size: 2048
  seed: 42
  test_images_dir: test/test_images
  train_images_dir: train/train_images
  train_ratio: 0.8
  val_ratio: 0.2
device:
  gpu_index: 0
  prefer_gpu: true
frangi:
  alpha: 0.5
  beta: 0.5
  black_ridges: true
  gamma: 15
  max_area: 50000
  min_area: 100
  scales:
  - 1
  - 2
  - 3
  - 5
  - 8
  threshold: 0.15
fusion:
  alphas:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  default_alpha: 0.5
model:
  dropout: 0.1
  hidden_dim: 128
  in_channels: 1
  name: mask2former
  num_decoder_layers: 3
  num_queries: 20
morphology:
  min_filament_area: 50
  skeleton_method: lee
output:
  checkpoint_dir: checkpoints
  experiment_dir: experiments
  visualization_dir: outputs/visualizations
training:
  amp: true
  batch_size: 4
  epochs: 1
  gradient_clip: 1.0
  lr: 0.0001
  patience: 10
  scheduler: cosine
  weight_decay: 1.0e-05
